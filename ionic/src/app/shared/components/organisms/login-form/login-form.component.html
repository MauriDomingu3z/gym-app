<form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
  <ion-item lines="none" class="login-form__item">
    <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
    <ion-input
      label="Email"
      labelPlacement="floating"
      type="email"
      formControlName="email"
      autocomplete="email"
    ></ion-input>
  </ion-item>

  <ion-item lines="none" class="login-form__item">
    <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
    <ion-input
      label="Contraseña"
      labelPlacement="floating"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    ></ion-input>
  </ion-item>

  @if (errorMessage()) {
    <ion-text color="danger">
      <p class="login-form__error">{{ errorMessage() }}</p>
    </ion-text>
  }

  <ion-button expand="block" type="submit" [disabled]="loading()" class="login-form__submit">
    {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    @if (!loading()) {
      <ion-icon slot="end" name="arrow-forward" aria-hidden="true"></ion-icon>
    }
  </ion-button>
</form>
