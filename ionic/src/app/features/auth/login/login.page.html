<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-shell">
    <div class="brand">
      <ion-icon name="flash" aria-hidden="true"></ion-icon>
      <span>GYM APP</span>
    </div>

    <div class="auth-card">
      <div class="auth-card__header">
        <h2>Bienvenido de nuevo</h2>
        <p>Ingresá tus credenciales para acceder a tu cuenta.</p>
      </div>

      <app-login-form
        [loading]="loading()"
        [errorMessage]="errorMessage()"
        (submitted)="onSubmit($event)"
      ></app-login-form>

      <p class="auth-footer">¿No tenés cuenta? <a routerLink="/auth/register">Registrate</a></p>
    </div>
  </div>
</ion-content>
